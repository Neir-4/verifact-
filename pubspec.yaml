name: caught
description: CAUGHT! — Companion app for the physical card game about social media literacy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # QR scanning
  mobile_scanner: ^5.2.3

  # Persistence
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.2.7

  # Open URLs
  url_launcher: ^6.3.0

  # Typography
  google_fonts: ^6.2.1

  # UUID generation for player IDs
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cards.json
