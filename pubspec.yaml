name: verifact
description: VERIFACT — Companion app for the physical card game about social media literacy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # QR scanning
  mobile_scanner: ^5.2.3

  # Persistence
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.2.7

  # Open URLs
  url_launcher: ^6.3.0

  # Typography
  google_fonts: ^6.2.1

  # UUID generation for player IDs
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/cards.json

flutter_native_splash:
  color: "#080516"
  color_dark: "#080516"
  image: assets/branding/verifact_logo.png
  android_12:
    color: "#080516"
    color_dark: "#080516"
    image: assets/branding/verifact_logo.png
  fullscreen: true

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#080516"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
